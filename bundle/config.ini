[global]
# 启动时自动更新 (1 开，0 关)
auto-update = 0
# GitHub 代理加速地址，无法从 GitHub 获取更新时设置
gh-proxy =
# 绕过 Cloudflare 保护的服务地址，用法详见 https://github.com/sarperavci/CloudflareBypassForScraping
cf-bypass =

[download]
# 下载路径
download-path = downloads
# 下载格式 (可选 epub, txt, html, pdf，默认 epub)
extname = epub
# 当下载格式为 txt 时，可设置其编码为 GBK 以兼容旧设备 (默认 UTF-8)
txt-encoding =
# 下载完成后保留章节缓存目录 (1 开，0 关)
preserve-chapter-cache = 0
# 是否启用下载进度条
enable-progressbar = 1

[source]
# 书籍内容语言 (可选 zh-CN, zh-TW, zh-Hant，默认自动)
language =
# 激活规则文件路径
active-rules = main.json
# 指定当前激活规则中的某个书源，用于指定搜索、批量下载 (填写书源 ID)
source-id =
# 每个书源只显示前 N 条搜索记录 (不指定则为全部)
search-limit = 30
# 过滤低相似度搜索结果 (1 开，0 关)
search-filter = 1

[crawl]
# 并发上限 (默认 50)
concurrency =
# 最小间隔 (毫秒)
min-interval = 200
# 最大间隔 (毫秒)
max-interval = 400
# 启用重试，不启用则下载出错时立即中断 (1 开，0 关)
enable-retry = 1
# 最大重试次数 (针对首次下载失败的章节)
max-retries = 3
# 重试最小间隔 (毫秒)
retry-min-interval = 2000
# 重试最大间隔 (毫秒)
retry-max-interval = 4000

[web]
# 启用 Web 服务 (1 开，0 关)
enabled = 0
# Web 服务端口
port = 7765

[cookie]
# 此处填写 qidian cookie (w_tsfp=xxx) 以获取最新封面
qidian =

[proxy]
# 启用 HTTP 代理 (针对需要代理的书源。1 开，0 关)
enabled = 0
host = 127.0.0.1
port = your port

[ai]
# 启用 AI 校对：修正错别字/同音误写，并删除乱码 (1 开，0 关)
enabled = 0
# 确定性乱码清理（不消耗 token，纯本地规则）。enabled=1 时生效
fix-garbled = 1
# OpenAI 兼容接口地址，需含 /v1（如 https://api.deepseek.com/v1）
base-url =
# 模型名
model = deepseek-chat
# API 密钥。建议改用环境变量 SONOVEL_AI_KEY 或启动参数 -Dai.api-key=xxx，避免明文入库；
# 三者同时存在时优先级：环境变量 > 启动参数 > 本文件
api-key =
# 单次请求超时 (秒)
timeout = 60
# 单次回复的最大 token 数
max-tokens = 1200
# 一次送审的正文长度 (字)。太小会丢失上下文，太大容易让模型漏改
chunk-size = 1200
# 专有名词保护表上限（来自百科 + 本书正文统计）
max-terms = 200
# 每次 AI 请求之间的节流 (毫秒)，用于规避服务商 RPM 限流
min-interval = 300
# 校对并发数（章节文件之间并行；同一章内始终串行）
concurrency = 4
# 生成「书名 (作者) 校对记录.log」，逐条记录改动与被拒绝的建议 (1 开，0 关)
audit = 1
# 说明：AI 只会提出「原文片段 → 修正片段」的替换对，程序逐条校验（唯一命中、
# 不碰专有名词、不做简繁转换、改动幅度受限）后才落笔；任何校验不过的建议
# 一律保留原文并记入日志。查不到百科条目时会自动转入保守模式，宁可不改。
